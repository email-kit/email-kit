<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<title>Order {{orderNumber}} confirmed</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
.bg { background-color: #f4f4f5; }
.card { background-color: #ffffff; border-radius: 8px; }
.text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 24px; color: #18181b; mso-line-height-rule: exactly; }
h1 { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 28px; line-height: 36px; color: #18181b; }
.cell { padding: 8px 0; border-bottom: 1px solid #e4e4e7; }
.btn { background-color: #18181b; color: #ffffff; text-decoration: none; display: inline-block; padding: 12px 24px; border-radius: 6px; }
a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
@media (max-width: 600px) { .stack { display: block !important; width: 100% !important; } }
@media (prefers-color-scheme: dark) { .bg { background-color: #09090b !important; } .text { color: #fafafa !important; } }
[data-ogsc] .text { color: #fafafa !important; }
</style>
</head>
<body style="margin:0;padding:0;">
<div role="article" aria-roledescription="email" aria-label="Order {{orderNumber}} confirmed" lang="en" dir="ltr">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all">Thanks for your order&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;</div>
<table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0"><tbody><tr><td align="center">
<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px"><tbody>
<tr><td class="text" style="padding:24px"><h1>Thanks, {{customerName}}!</h1></td></tr>
<tr><td class="text" style="padding:0 24px">Your order {{orderNumber}} is confirmed. Use code &#123;{{code}}&#125; at checkout.</td></tr>
{{#items}}<tr><td class="text cell stack" width="70%">{{name}} × {{qty}}</td><td class="text cell stack" align="right">{{price}}</td></tr>
{{/items}}{{^items}}<tr><td class="text" colspan="2">No items.</td></tr>
{{/items}}<tr><td class="text" style="padding:24px" dir="rtl" lang="ar">شكرا لك</td></tr>
<tr><td align="center" style="padding:24px">
<!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{orderUrl}}" style="height:44px;v-text-anchor:middle;width:200px;" arcsize="14%" stroke="f" fillcolor="#18181b"><w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;">View your order</center></v:roundrect><![endif]-->
<!--[if !mso]><!--><a class="btn" href="{{orderUrl}}" target="_blank">View your order</a><!--<![endif]-->
</td></tr>
<tr><td><img src="https://cdn.example/logo.png" width="120" height="40" alt="Example Shop" style="display:block"></td></tr>
</tbody></table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></tbody></table>
</div>
</body>
</html>
