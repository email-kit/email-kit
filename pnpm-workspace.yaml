packages:
  - packages/*
  - spikes/*
  - examples/*

# Shared versions for tools used by several packages. Reference them with "catalog:".
catalog:
  "@types/node": 22.20.5
  "@valibot/to-json-schema": 1.8.0
  arktype: 2.2.9
  rolldown: 1.2.15
  tsdown: 0.23.2
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: 5.0.5
  zod: 4.6.7

# Supply-chain safety: don't install versions published less than a day ago.
minimumReleaseAge: 1440

# Lifecycle scripts stay off (CONTRIBUTING supply-chain rules). These only verify a native binary
# that pnpm already installs through optionalDependencies. Used by the P0-11 spike only.
allowBuilds:
  "@swc/core": false
  esbuild: false
